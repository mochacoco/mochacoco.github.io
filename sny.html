<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memo App — Advanced</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e5e7eb;
      --primary: #2563eb;
      --danger: #ef4444;
      --done: #6b7280; /* gray-600 */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg); color: var(--text);
      line-height: 1.5;
      display: grid; place-items: start center;
      min-height: 100dvh; padding: 24px;
    }
    .app { width: 100%; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .composer { padding: 16px; display: grid; gap: 12px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .hstack { display: flex; align-items: center; gap: 8px; }
    .fields { display: grid; gap: 8px; }
    .line { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 8px; }

    input[type="text"], textarea, select {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); font: inherit; outline: none; background: #fff;
    }
    input[type="checkbox"] { width: 18px; height: 18px; }

    .title-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .title-sub { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }

    .right { justify-self: end; margin-left: auto; }
    .hint { color: var(--muted); font-size: 14px; }

    button {
      appearance: none; border: 1px solid var(--border); background: #fff; color: var(--text);
      padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer;
      transition: box-shadow .15s ease, transform .02s ease;
    }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.ghost { background: #fff; }
    button.icon { width: 36px; height: 36px; border-radius: 9px; font-size: 18px; line-height: 1; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button.sort-on { background: var(--danger); color: #fff; border-color: var(--danger); }
    button:active { transform: translateY(1px); }

    .stack-wrap { padding: 8px 16px 0; display: grid; gap: 8px; }
    .stack-toolbar { display: grid; grid-template-columns: 1fr auto; align-items: center; }
    .stack { margin-top: 8px; padding: 0 0 16px; display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr));}

    .memo-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
    .memo-head { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .memo-sub { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; color: var(--muted); font-size: 14px; }

.memo-card[draggable="true"] { cursor: grab; }
.memo-card.dragging { opacity: .6; }
.memo-card.drag-over { outline: 2px dashed var(--primary); }

    .list { display: grid; gap: 6px; }
    .ts { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); text-align: center; padding: 18px; }
    .prio { font-weight: 700; }

    .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .urgent { border-color: var(--primary); color: #fff; background: var(--primary); }
    .urgent.active { border-color: var(--danger); background: var(--danger); }

    .color-wrap { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .color-select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); }

    /* list item styles when checked */
    .done-text { color: var(--done); text-decoration: line-through; }
    .line-time { color: var(--muted); font-size: 12px; margin-left: 8px; }

    /* Priority segmented control */
    //.prio-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    //.prio-seg .seg { padding: 6px 10px; border-right: 1px solid var(--border); cursor: pointer; user-select: none; font-size: 13px; background: #fff; }
    //.prio-seg .seg:last-child { border-right: none; }
    //.prio-seg .seg.active { background: var(--primary); color: #fff; }
.prio-seg {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 10px;   /* rounded outer frame */
  overflow: hidden;
}

.prio-seg .seg {
  padding: 6px 10px;
  cursor: pointer;
  user-select: none;
  font-size: 13px;
  background: #fff;
  border-right: 1px solid var(--border);
  border-radius: 0;      /* reset rounding for all middle buttons */
}

.prio-seg .seg:first-child {
  border-top-left-radius: 10px;
  border-bottom-left-radius: 10px;
}

.prio-seg .seg:last-child {
  border-right: none;    /* no divider after the last one */
  border-top-right-radius: 10px;
  border-bottom-right-radius: 10px;
}

.prio-seg .seg.active {
  background: var(--primary);
  color: #fff;
}
.sub-seg .seg { font-size: 12px; padding: 4px 8px; }
.memo-title {
  font-size: 18px;

}

.memo-subtitle {
  
font-size: 20px;
  font-weight: 700;
color: #0f172a;
}

.memo-text {
  font-size: 15px;
}

.layout {
  display: grid;
  grid-template-columns: 3fr 1fr; /* 왼쪽 75%, 오른쪽 25% */
  gap: 16px;
  width: 100%;
  min-height: 100dvh;
}

/* 왼쪽 메모 3열 그리드 (이미 3열이라면 유지) */
#mainCol .stack {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-content: start;
}

/* 오른쪽 S 패널 */
#sPanel {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: calc(100dvh - 24px);
  position: sticky; top: 12px; /* 스크롤 시 고정 */
  overflow: hidden;
}

.panel-head {
  font-weight: 700;
  font-size: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.panel-list {
  overflow: auto;
  display: grid;
  gap: 8px;
}

/* S 항목 줄 레이아웃 */
.sline {
  display: grid;
  grid-template-columns: auto auto 1fr; /* 체크박스 | 배지 | 텍스트 */
  align-items: center;
  gap: 8px;
  padding: 8px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  background: #fff;
}

.sline .badge {
  font-size: 12px;
  font-weight: 700;
  border: 1px solid #ddd;
  border-radius: 999px;
  padding: 0 8px;
  line-height: 20px;
}

.sline .s-text {
  font-size: 14px;
}

.sline .s-meta {
  grid-column: 1 / -1; /* 다음 줄에 메모 타이틀 */
  font-size: 12px;
  color: var(--muted);
  margin-left: 26px; /* 체크박스+배지 폭만큼 들여쓰기 */
}

/* 드롭다운 메뉴 기본 */
.menu {
  position: absolute;
  top: 32px; right: 8px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  padding: 6px;
  min-width: 160px;
  display: none;
  z-index: 30;
}
.menu.open { display: block; }
.menu button {
  width: 100%;
  background: transparent;
  border: 0;
  text-align: left;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}
.menu button:hover { background: #f5f5f5; }

/* 서브메뉴(오른쪽으로 펼침) */
.submenu {
  position: absolute;
  top: 0; left: calc(100% + 6px);
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  padding: 8px;
  min-width: 180px;
  display: none;
  z-index: 40;
}
.submenu.open { display: block; }

/* 색상 칩 그리드 */
.swatch-grid {
  display: grid;
  grid-template-columns: repeat(6, 24px);
  gap: 8px;
}
.swatch {
  width: 24px; height: 24px;
  border-radius: 6px;
  border: 1px solid rgba(0,0,0,.12);
  cursor: pointer;
}
.swatch:focus { outline: 2px solid rgba(0,0,0,.25); outline-offset: 2px; }

/* 우상단 버튼/타임스탬프 겹침 방지(이전 패치 유지 권장) */
.memo-card { position: relative; overflow: visible; }
.memo-head { position: relative; padding-right: 64px; }
.memo-head .ts { position: absolute; top: 8px; right: 36px; }
.kebab { position:absolute; top:8px; right:8px; background:transparent; border:0; padding:4px 6px; font-size:18px; color:var(--muted); z-index:20; }
.kebab:hover{ color:var(--text); }

.color-wrap { display: none; }

  </style>
</head>
<body>
  <main class="app">
<div class="hstack" style="margin-bottom:12px; gap:8px;">
  <button id="exportBtn" type="button">저장하기</button>
  <button id="importBtn" type="button">불러오기</button>
  <input id="importFileInput" type="file" accept="application/json" style="display:none;" />
</div>

    <!-- Composer (Top Placeholder) -->
    <section class="card" id="composerCard">
      <div class="composer">
        <!-- First row: Title    [ Save button at timestamp position ] -->
        <div class="title-row">
          <input id="titleInput" type="text" placeholder="(제목)" />
          <!-- Save button occupies the [timestamp] slot in the composer -->
          <button id="saveBtn" type="button" class="primary right" title="Save memo">Save</button>
        </div>

        <!-- Second row: (subtitle)    (priority: 1~9) -->
        <div class="title-sub">
          <input id="subtitleInput" type="text" placeholder="(소제목)" />
          <div class="hstack">
            <span class="hint">중요도</span>
            <div id="prioritySeg" class="prio-seg"></div>
          </div>
        </div>
        </div>

        <!-- Lines: (checkbox) (memo)  plus (+) to add, minus (-) to remove extra lines -->
        <div class="fields">
          <div id="lines"></div>
          <div class="hstack right">
            <button id="addLineBtn" type="button" class="icon ghost" title="Add line">+</button>
          </div>
        </div>
      </div>

      <!-- Saved memos controls + stack -->
      <div class="stack-wrap">
        <div class="stack-toolbar">
          <div class="hint">메모</div>
          <div class="hstack">
            <button id="sortBtn" type="button" class="ghost" title="Sort by priority">Sort</button>
          </div>
        </div>


        <div class="layout">
    <section id="mainCol">
      <div class="stack" id="memoStack">
        <div class="empty" id="emptyState">No memos yet. Your saved memos will appear here.</div>
      </div>
    </section>

    <aside id="sPanel">
      <div class="panel-head">샘플링 모아보기</div>
      <div id="sList" class="panel-list"></div>
    </aside>
        </div>
      </div>


    </section>
  </main>

  <script>
    // --- Persistence ---
    const STORAGE_KEY = 'memoApp.memos.v4';

    // --- Constants ---
    const DEFAULT_BG = '#FFE4C4'; // bisque
	const COLOR_OPTIONS = [
  '#FD8A8A',
  '#FFCBCB',
  '#9EA1D4',
  '#F1F7B5',
  '#A8D1D1',
  '#DFEBEB',
  '#C3DCD8',
  '#EFD1D4',
  '#FBE8ED',
  '#DBD9DA',
  '#EFE1E1',
  '#F0D2DA',
  '#E0C1C6',
  '#D1B4C6',
  '#CBC4D6',
  '#EADBDD',
  '#FCD5CE',
  '#FFCAD4',
  '#FADDE1',
  '#FFF1F5',
  '#F6EEE9'
];
    // --- State ---
    const state = {
      memos: [],
      composer: {
        title: '',
        subtitle: '',
        priority: 3,
        lines: [] // { id, text, checked, checkedAt }
      },
      sortMode: 'time', // 'time' | 'priority'
      editingId: null,  // memo.id currently being edited
      editDraft: null   // temp draft when editing
    };

    // --- Elements ---
    const titleInput = document.getElementById('titleInput');
    const subtitleInput = document.getElementById('subtitleInput');
    const prioritySegEl = document.getElementById('prioritySeg');
    const saveBtn = document.getElementById('saveBtn');
    const addLineBtn = document.getElementById('addLineBtn');
    const sortBtn = document.getElementById('sortBtn');
    const linesEl = document.getElementById('lines');
    const stack = document.getElementById('memoStack');
    const emptyState = document.getElementById('emptyState');

    // --- Utils ---
    const nowStamp = () => new Date().toLocaleString();
    const uid = () => Math.random().toString(36).slice(2, 10);
    const persist = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state.memos));
function clampPrio(p){ p = parseInt(p,10)||3; return Math.max(1, Math.min(5, p)); }
    const load = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.memos = JSON.parse(raw) || [];
    // [ADDED] migrate old data (1~9 -> 1~5, add subPrio)
    state.memos.forEach(m => {
      m.priority = clampPrio(m.priority);
      (m.lines || []).forEach(l => {
    	if (l.subPrio == null) l.subPrio = 2; // 기본값 여전히 2
      });
    });
  } catch (_) {}
};
    const effPriority = (m) => (m.urgent ? 10 : (parseInt(m.priority, 10) || 0));

const subRank = (l) => {
  // E는 내부 저장을 4로 쓴다면 그대로 parseInt만 해도 됨
  // 혹시 문자열 'E'로 온다면 아래 한 줄만 유지하면 됨:
  // if (l.subPrio === 'E') return 4;
  const v = parseInt(l.subPrio, 10);
  return Number.isFinite(v) ? v : 0;
};

function sortLinesBySubPrio(lines, original) {
  // original: 원래 배열(타이브레이커로 처음 순서 유지)
  const arr = (lines || []).slice();
  arr.sort((a, b) => {
    // 1) subpriority: 큰 값이 먼저 (E=4 > 3 > 2 > 1)
    const sb = subRank(b) - subRank(a);
    if (sb) return sb;

    // 2) 체크 여부로도 묶고 싶으면(미체크 우선) 켜세요:
    // if (!!a.checked !== !!b.checked) return a.checked - b.checked;

    // 3) 같은 값이면 초기 입력 순서를 유지
    return original.indexOf(a) - original.indexOf(b);
  });
  return arr;
}



const maxSubPrio = (m) =>
  Math.max(
    0,
    ...((m.lines || []).map(l => {
      const v = parseInt(l.subPrio, 10);
      return Number.isFinite(v) ? v : 0; // (E는 숫자 4로 저장했다고 가정)
    }))
  );



    function updateSortButton() {
      if (state.sortMode === 'priority') {
        sortBtn.classList.add('sort-on');
      } else {
        sortBtn.classList.remove('sort-on');
      }
    }

    // --- Composer line management ---
    function ensureAtLeastOneLine() {
  if (!Array.isArray(state.composer.lines)) state.composer.lines = [];
  if (state.composer.lines.length === 0) {
    state.composer.lines.push({ id: uid(), text: '', checked: false, checkedAt: null, subPrio: 2 }); // [CHANGED]
  }
}
function addLine(text = '', checked = false) {
  state.composer.lines.push({ id: uid(), text, checked, checkedAt: null, subPrio: 2 }); // [CHANGED]
  renderComposerLines();
}

    function removeLine(id) {
      if (state.composer.lines.length <= 1) return; // keep at least one line
      state.composer.lines = state.composer.lines.filter(l => l.id !== id);
      renderComposerLines();
    }

    function renderComposerLines() {
  ensureAtLeastOneLine();
  linesEl.innerHTML = '';
  state.composer.lines.forEach((line) => {
    const row = document.createElement('div');
    row.className = 'line';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!line.checked;
    cb.addEventListener('change', () => { line.checked = cb.checked; line.checkedAt = cb.checked ? nowStamp() : null; });

    

    const text = document.createElement('input');
    text.type = 'text';
    text.placeholder = '(memo)';
    text.value = line.text || '';
    text.addEventListener('input', () => { line.text = text.value; });

const sub = document.createElement('div'); // [ADDED] sub-priority control
    renderSubPrioSeg(sub, line.subPrio ?? 2, (val) => { 
line.subPrio = val; 
renderComposerLines();

});

    const ctrls = document.createElement('div');
    ctrls.className = 'hstack right';
    if (state.composer.lines.length > 1) {
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'icon danger';
      removeBtn.title = 'Remove line';
      removeBtn.textContent = '−';
      removeBtn.addEventListener('click', () => removeLine(line.id));
      ctrls.appendChild(removeBtn);
    }

    row.appendChild(cb);
    
    row.appendChild(text);
row.appendChild(sub);   // [ADDED]
    row.appendChild(ctrls);
    linesEl.appendChild(row);
  });
}

    // --- Render saved memos ---
    function renderSaved() {
  // Clear existing
  stack.querySelectorAll('.memo-card').forEach(n => n.remove());

  if (state.memos.length === 0) {
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  // [CHANGED] sort: priority 모드에서만 정렬. time 모드는 현재 배열 순서 유지(커스텀 순서).
  let items = state.memos;
  if (state.sortMode === 'priority') {
    items = state.memos.slice().sort((a, b) => {
      const ap = effPriority(a), bp = effPriority(b);
      if (bp !== ap) return bp - ap;

const as = maxSubPrio(a), bs = maxSubPrio(b);
    if (bs !== as) return bs - as;


      const at = new Date(a.createdAt).getTime();
      const bt = new Date(b.createdAt).getTime();
      return bt - at;
    });
  }

  items.forEach(m => {
    const card = document.createElement('article');
    card.className = 'memo-card';
    card.style.background = m.bg || DEFAULT_BG;
    card.dataset.id = m.id;

    // [ADD] time 모드에서만 드래그 가능
    if (state.sortMode === 'time' && state.editingId !== m.id) {
      card.setAttribute('draggable', 'true');
      card.addEventListener('dragstart', handleDragStart);
      card.addEventListener('dragover', handleDragOver);
      card.addEventListener('dragleave', handleDragLeave);
      card.addEventListener('drop', handleDrop);
      card.addEventListener('dragend', handleDragEnd);
    }

    if (state.editingId === m.id) {
      renderEditCard(card, m);
    } else {
      renderReadCard(card, m);
    }
    stack.appendChild(card);
  });

renderSPanel();
}

let dragSrcId = null;

function handleDragStart(e) {
  dragSrcId = this.dataset.id;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function handleDragOver(e) {
  e.preventDefault(); // allow drop
  this.classList.add('drag-over');
  e.dataTransfer.dropEffect = 'move';
}

function handleDragLeave() {
  this.classList.remove('drag-over');
}

function handleDrop(e) {
  e.preventDefault();
  this.classList.remove('drag-over');
  const fromId = dragSrcId;
  const toId = this.dataset.id;
  if (!fromId || fromId === toId) return;

  const fromIndex = state.memos.findIndex(m => m.id === fromId);
  const toIndex   = state.memos.findIndex(m => m.id === toId);
  if (fromIndex < 0 || toIndex < 0) return;

  const [moved] = state.memos.splice(fromIndex, 1);
  state.memos.splice(toIndex, 0, moved);
  persist();
  renderSaved();
}

function handleDragEnd() {
  this.classList.remove('dragging');
  stack.querySelectorAll('.memo-card').forEach(c => c.classList.remove('drag-over'));
}


    function renderReadCard(card, m) {
      const head = document.createElement('div');
      head.className = 'memo-head';
      const title = document.createElement('div');
title.className = 'memo-title';
      title.textContent = m.title || '(Untitled)';
      const ts = document.createElement('div');
      ts.className = 'ts';
      ts.textContent = m.createdAt;
      head.appendChild(title);
      head.appendChild(ts);

card.appendChild(head);
card.classList.add('memo-card'); // position 기준(중복 무해)

  // ⋮ 버튼
  const kebab = document.createElement('button');
  kebab.type = 'button';
  kebab.className = 'kebab';
  kebab.textContent = '⋮';

  // 메인 메뉴
  const menu = document.createElement('div');
  menu.className = 'menu';

  // "색 변경하기 ▸" 항목
  const colorMenuBtn = document.createElement('button');
  colorMenuBtn.type = 'button';
  colorMenuBtn.className = 'submenu-toggle';
  colorMenuBtn.textContent = '색 변경하기 ▸';

  // 서브메뉴(컬러칩)
  const subMenu = document.createElement('div');
  subMenu.className = 'submenu';

  const grid = document.createElement('div');
  grid.className = 'swatch-grid';
  (COLOR_OPTIONS || []).forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch';
    b.style.background = c;
    b.title = c;
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      m.bg = c;
      card.style.background = c;
      persist();
      subMenu.classList.remove('open');
      menu.classList.remove('open');
    });
    grid.appendChild(b);
  });
  subMenu.appendChild(grid);

  colorMenuBtn.addEventListener('click', (e) => {

    function startEdit(m) {
      state.editingId = m.id;
      state.editDraft = JSON.parse(JSON.stringify(m));
      renderSaved();
    }

    function cancelEdit() {
      state.editingId = null;
      state.editDraft = null;
      renderSaved();
    }

    function saveEdit() {
      if (!state.editingId || !state.editDraft) return;
      const idx = state.memos.findIndex(mm => mm.id === state.editingId);
      if (idx >= 0) {
        state.memos[idx] = { ...state.memos[idx], ...state.editDraft };
        persist();
      }
      cancelEdit();
    }

    // --- Save flow for new memo ---
function saveMemo() {
  const title = (titleInput.value || '').trim();
  const subtitle = (subtitleInput.value || '').trim();
  const priority = parseInt(state.composer.priority, 10) || 3; // [CHANGED] default 3
  const lines = state.composer.lines.map(l => ({
    text: (l.text || '').trim(),
    checked: !!l.checked,
    checkedAt: l.checked ? (l.checkedAt || nowStamp()) : null,
    subPrio: (l.subPrio == null ? 2 : l.subPrio) // [ADDED]
  }));

  if (!lines.length) addLine('', false);

  const memo = {
    id: uid(),
    createdAt: nowStamp(),
    title, subtitle, priority,
    urgent: false,
    bg: DEFAULT_BG,
    lines
  };

  state.memos.unshift(memo);
  persist();

  // reset
  titleInput.value = '';
  subtitleInput.value = '';
  state.composer.lines = [{ id: uid(), text: '', checked: false, checkedAt: null, subPrio: 2 }]; // [CHANGED]
  renderComposerLines();
  renderSaved();
}

    function renderPrioritySeg(el, current, onChange) {
      el.innerHTML = '';

      for (let i = 1; i <= 5; i++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'seg' + (i === current ? ' active' : '');

function renderSubPrioSeg(el, current, onChange) {
  el.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'prio-seg sub-seg';
  const opts = [1,2,3,4, 5]; // 4 == S, 5 == E
  opts.forEach(v => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'seg' + (v === (parseInt(current,10)||2) ? ' active' : '');
    b.textContent = (v === 4) ? 'S' : (v === 5 ? 'E' : String(v));
    b.addEventListener('click', () => onChange(v));
    box.appendChild(b);
  });
  el.appendChild(box);
}

const importFileInput = document.getElementById('importFileInput');

importFileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (Array.isArray(imported)) {
        state.memos = imported;
        persist();
        renderSaved();
        alert('메모를 불러왔습니다!');
      } else {
        alert('잘못된 파일 형식입니다.');
      }
    } catch (err) {
      alert('불러오기 실패: ' + err.message);
    }
  };
  reader.readAsText(file);
});

// S 패널: subPrio === 4(S) 인 항목만 수집하여 보여주기 (체크된 건 제외)
function renderSPanel() {
  const listEl = document.getElementById('sList');
  if (!listEl) return;
  listEl.innerHTML = '';

  // 모든 메모에서 S 항목 수집
  const sItems = [];
  state.memos.forEach(m => {
    (m.lines || []).forEach((l) => {
      const v = parseInt(l.subPrio, 10) || 0; // S=4, E=5 기준
      if (v === 4 && !l.checked) {
        sItems.push({ m, l });
      }
    });
  });

  // 우선순위 높은 메모 먼저 (동률이면 최신 메모 먼저)
  sItems.sort((a, b) => {
    const ap = parseInt(a.m.priority, 10) || 0;
    const bp = parseInt(b.m.priority, 10) || 0;
    if (bp !== ap) return bp - ap;
    const at = new Date(a.m.createdAt || 0).getTime();
    const bt = new Date(b.m.createdAt || 0).getTime();
    return bt - at;
  });

  if (!sItems.length) {
    const empty = document.createElement('div');
    empty.className = 'muted';
    empty.textContent = '샘플링 목록 비어있음';
    listEl.appendChild(empty);
    return;
  }

  sItems.forEach(({ m, l }) => {
    const row = document.createElement('div');
    row.className = 'sline';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!l.checked;
    cb.addEventListener('change', () => {
      l.checked = cb.checked;
      l.checkedAt = cb.checked ? nowStamp() : null;
      persist();        // 로컬+클라우드 반영
      renderSaved();    // 메인/패널 동시 갱신
    });

    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = 'S';

    const text = document.createElement('div');
    text.className = 's-text';
    text.textContent = l.text || '';

    const meta = document.createElement('div');
    meta.className = 's-meta';
    meta.textContent = m.subtitle || '(Untitled)';

    row.appendChild(cb);

    row.appendChild(text);
    row.appendChild(meta);
    listEl.appendChild(row);
  });
}
